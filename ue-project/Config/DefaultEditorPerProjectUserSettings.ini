[/Script/ModelContextProtocol.ModelContextProtocolSettings]
; The MCP server does not listen at all unless this is true.
bAutoStartServer=True

; Serve MCP on a fixed port so the gateway config is reproducible.
ServerPortNumber=8000

; Expose the complete tool list instead of only list_toolsets / describe_toolset
; / call_tool meta-tools. Our gateway builds its own local index from the full
; listing, which is exactly what the plan's deferred mode requires.
bEnableToolSearch=False

; Origin allow-list is the defense against DNS rebinding. localhost, 127.0.0.1
; and [::1] are accepted by default, so we deliberately add nothing here.
; Do NOT add a wildcard: it would let any web page reach this editor server.
